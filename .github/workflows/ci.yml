name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile main.py runner.py docker_backend.py terminal_bridge.py template_runner.py template_setup_funpay.py github_worker.py github_watch.py private_repo_patch.py sqlite_inspector.py db_connection.py launcher.py
      - run: python -m unittest discover -s tests -p 'test_terminal_bridge.py' -v
